<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daniel .Com</title>
  <!-- Force Korean site-wide, then enter the site.
       The language choice is stored in localStorage and shared by every page. -->
  <script>
    try { localStorage.setItem("lang", "ko"); } catch (e) {}
    location.replace("index.html");
  </script>
  <!-- Fallback for when JavaScript is disabled -->
  <meta http-equiv="refresh" content="0; url=index.html" />
</head>
<body>
  <p style="font-family: -apple-system, sans-serif; padding: 24px; color: #555;">
    한국어 페이지로 이동 중입니다… <a href="index.html">계속하기</a>
  </p>
</body>
</html>
