<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daniel .Com</title>
  <!-- Force Korean for this browsing session, then enter the site.
       Stored in sessionStorage so it lasts while browsing but resets to
       English on the next visit. -->
  <script>
    try { sessionStorage.setItem("lang", "ko"); } catch (e) {}
    location.replace("/");
  </script>
  <!-- Fallback for when JavaScript is disabled -->
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body>
  <p style="font-family: -apple-system, sans-serif; padding: 24px; color: #555;">
    한국어 페이지로 이동 중입니다… <a href="/">계속하기</a>
  </p>
</body>
</html>
